# Load balances across N replicas of graphql-gateway, the way a real edge load balancer (an
# AWS ALB, in Netflix's actual case) sits in front of a fleet of gateway instances. This is a
# DIFFERENT layer of load balancing than anything inside the Java code in this repo:
#
#   - This file: external, "which gateway REPLICA handles this HTTP request" (round-robin here).
#   - grpc-client-spring-boot-starter's "static://asset-service:9090": internal, resolved once
#     via Podman's container DNS, no active balancing logic of its own at this repo's scale.
#
# See docs/ARCHITECTURE_VS_BLOG.md for how this maps (loosely) to Netflix's real edge (an ALB)
# vs. internal (ProxyD-based service mesh) layers.

upstream gateway_backend {
    least_conn;
    server graphql-gateway-1:8080;
    server graphql-gateway-2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Simple health check location so you can curl the LB itself without hitting a gateway.
    location = /lb-health {
        return 200 "nginx-lb ok\n";
        add_header Content-Type text/plain;
    }
}
